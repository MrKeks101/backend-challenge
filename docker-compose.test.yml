# Infra efêmera dos testes de integração/concorrência (portas distintas do ambiente de dev).
name: wagering-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 1s
      timeout: 3s
      retries: 60

  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "45566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 60
